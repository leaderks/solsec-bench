[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solsec-bench"
version = "0.1.0"
description = "Open security benchmark for AI on Solana"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Salomon Kamsu" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
solsec-bench = "solsec_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness/solsec_bench"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
markers = ["cargo: runs cargo builds (slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["solsec_bench"]
